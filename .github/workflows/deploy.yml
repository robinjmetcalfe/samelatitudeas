name: Deploy

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read deploy.json
        id: cfg
        run: |
          if [ ! -f deploy.json ]; then
            echo "live=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LIVE=$(node -e "const d=require('./deploy.json');process.stdout.write(String(d.live===true))")
          echo "live=$LIVE" >> "$GITHUB_OUTPUT"
          node -e "const d=require('./deploy.json');console.log(JSON.stringify(d))" > /tmp/deploy.json

      - name: Stop (not live)
        if: steps.cfg.outputs.live != 'true'
        run: echo "deploy.json missing or live=false; skipping."

      - name: Setup Node (for build step)
        if: steps.cfg.outputs.live == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Build (optional)
        if: steps.cfg.outputs.live == 'true'
        run: |
          BUILD=$(node -e "const d=require('./deploy.json');process.stdout.write(d.build||'')")
          if [ -n "$BUILD" ]; then
            echo "Running build: $BUILD"
            eval "$BUILD"
          else
            echo "No build step defined."
          fi

      - name: Prepare artifact
        if: steps.cfg.outputs.live == 'true'
        run: |
          ART=$(node -e "const d=require('./deploy.json');process.stdout.write(d.artifact_dir||'')")
          if [ -n "$ART" ]; then
            tar -czf /tmp/site.tgz -C "$ART" .
          else
            tar -czf /tmp/site.tgz --exclude='.git' --exclude='node_modules' .
          fi

      - name: Install SSH key
        if: steps.cfg.outputs.live == 'true'
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Upload artifact
        if: steps.cfg.outputs.live == 'true'
        run: |
          HOST="${{ secrets.DEPLOY_HOST }}"
          USER="${{ secrets.DEPLOY_USER }}"
          PROJECT=$(node -e "const d=require('./deploy.json');process.stdout.write(d.project||'site')")
          DEPLOY_PATH=$(node -e "const d=require('./deploy.json');process.stdout.write(d.deploy_path)")
          SHARED_PATH=$(node -e "const d=require('./deploy.json');process.stdout.write(d.shared_path||'')")
          REMOTE_TGZ="/tmp/deploy-${PROJECT}.tgz"
          scp -o StrictHostKeyChecking=accept-new /tmp/site.tgz "$USER@$HOST:$REMOTE_TGZ"
          if [ -n "$SHARED_PATH" ]; then
            ssh -o StrictHostKeyChecking=accept-new "$USER@$HOST" "rm -rf '$DEPLOY_PATH' && mkdir -p '$DEPLOY_PATH' '$SHARED_PATH' && tar -xzf '$REMOTE_TGZ' -C '$DEPLOY_PATH' && rm -f '$REMOTE_TGZ'"
          else
            ssh -o StrictHostKeyChecking=accept-new "$USER@$HOST" "rm -rf '$DEPLOY_PATH' && mkdir -p '$DEPLOY_PATH' && tar -xzf '$REMOTE_TGZ' -C '$DEPLOY_PATH' && rm -f '$REMOTE_TGZ'"
          fi

      - name: Sync env file (optional)
        if: steps.cfg.outputs.live == 'true'
        run: |
          ENV_FILE=$(node -e "const d=require('./deploy.json');process.stdout.write(d.env_file||'')")
          if [ -n "$ENV_FILE" ]; then
            HOST="${{ secrets.DEPLOY_HOST }}"
            USER="${{ secrets.DEPLOY_USER }}"
            SHARED_PATH=$(node -e "const d=require('./deploy.json');process.stdout.write(d.shared_path||'')")
            DEPLOY_PATH=$(node -e "const d=require('./deploy.json');process.stdout.write(d.deploy_path)")
            scp -o StrictHostKeyChecking=accept-new "$ENV_FILE" "$USER@$HOST:$SHARED_PATH/.env"
            ssh -o StrictHostKeyChecking=accept-new "$USER@$HOST" "ln -sf '$SHARED_PATH/.env' '$DEPLOY_PATH/.env'"
          fi

      - name: Configure Caddy (auto)
        if: steps.cfg.outputs.live == 'true'
        run: |
          HOST="${{ secrets.DEPLOY_HOST }}"
          USER="${{ secrets.DEPLOY_USER }}"
          PROJECT=$(node -e "const d=require('./deploy.json');process.stdout.write(d.project)")
          TYPE=$(node -e "const d=require('./deploy.json');process.stdout.write(d.type||'static')")
          PORT=$(node -e "const d=require('./deploy.json');process.stdout.write(String(d.port||''))")
          DEPLOY_PATH=$(node -e "const d=require('./deploy.json');process.stdout.write(d.deploy_path)")

          # Skip Caddy config for static sites (wildcard handles them)
          if [ "$TYPE" = "static" ]; then
            echo "Static site - using wildcard config"
            exit 0
          fi

          # Generate Caddy config based on type
          CADDY_FILE="/etc/caddy/sites/${PROJECT}.caddy"

          if [ "$TYPE" = "node" ] && [ -n "$PORT" ]; then
            CADDY_CONFIG="${PROJECT}.solarise.dev {
              import ip_restrict
              reverse_proxy localhost:${PORT}
            }"
          elif [ "$TYPE" = "laravel" ] || [ "$TYPE" = "wordpress" ]; then
            CADDY_CONFIG="${PROJECT}.solarise.dev {
              import ip_restrict
              root * ${DEPLOY_PATH}/public
              php_fastcgi unix//run/php/php8.3-fpm.sock
              file_server
              encode gzip
            }"
          else
            echo "Unknown/custom type or missing port - skipping Caddy config (managed manually)"
            exit 0
          fi

          echo "Writing Caddy config for ${PROJECT} (${TYPE})"
          ssh -o StrictHostKeyChecking=accept-new "$USER@$HOST" "echo '$CADDY_CONFIG' > '$CADDY_FILE' && sudo systemctl reload caddy"

      - name: Post-deploy (optional)
        if: steps.cfg.outputs.live == 'true'
        run: |
          HOST="${{ secrets.DEPLOY_HOST }}"
          USER="${{ secrets.DEPLOY_USER }}"
          CMD=$(node -e "const d=require('./deploy.json');process.stdout.write(d.post_deploy||'')")
          if [ -n "$CMD" ]; then
            DEPLOY_PATH=$(node -e "const d=require('./deploy.json');process.stdout.write(d.deploy_path)")
            ssh -o StrictHostKeyChecking=accept-new "$USER@$HOST" "cd '$DEPLOY_PATH' && $CMD"
          else
            echo "No post_deploy command defined."
          fi
